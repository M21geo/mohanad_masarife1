name: Build APK

on:
  workflow_dispatch:          # زر "Run workflow" من تبويب Actions
  push:
    tags: ["v*"]              # أو عند إنشاء tag مثل v0.1.0

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet
        run: pip install flet==0.28.3

      # أول مرة ينزّل Flet الـ Flutter والـ Android SDK تلقائياً (تأخذ عدة دقائق)
      - name: Build APK
        run: flet build apk -v

      - uses: actions/upload-artifact@v4
        with:
          name: masarif-apk
          path: build/apk/*.apk
